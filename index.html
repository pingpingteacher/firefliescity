<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>微光思辨</title>
<style>
:root{
  --bg:#0a0e17; --bg2:#111827; --gold:#e8c887; --gold-dim:#a8895a;
  --text:#eef1f6; --muted:#9aa4b8; --line:#2a3242;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:radial-gradient(ellipse at 50% 0%,#151d2e 0%,var(--bg) 70%);
  color:var(--text); font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  min-height:100%; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}
#app{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding:28px 22px 40px;}
.progress{font-size:12px; letter-spacing:2px; color:var(--gold-dim); text-align:right; margin-bottom:18px; opacity:.85;}
.card{animation:fadein .9s ease both;}
@keyframes fadein{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.kicker{font-size:13px; color:var(--gold-dim); letter-spacing:3px; margin-bottom:6px;}
h1{font-size:26px; line-height:1.4; margin-bottom:14px; color:var(--gold); font-weight:600;}
h1.small{font-size:20px;}
.artist{font-size:14px; color:var(--muted); margin-bottom:18px;}
p{font-size:16px; line-height:2; color:var(--text); margin-bottom:8px; white-space:pre-line;}
.big{font-size:22px; line-height:1.9; color:var(--gold); margin:26px 0 10px; font-weight:600; white-space:pre-line;}
.nodes{display:flex; flex-wrap:wrap; gap:10px; margin:20px 0; justify-content:center;}
.node{font-size:26px; background:#182236; border:1px solid var(--line); border-radius:50%; width:56px; height:56px; display:flex; align-items:center; justify-content:center; opacity:0; animation:pop .6s ease forwards;}
@keyframes pop{to{opacity:1; transform:scale(1);}}
.btn{
  display:block; width:100%; text-align:left; background:#141c2c; border:1px solid var(--line);
  color:var(--text); padding:16px 18px; border-radius:12px; margin-top:12px; font-size:16px;
  cursor:pointer; transition:.2s; font-family:inherit;
}
.btn:hover{border-color:var(--gold-dim); background:#1b2740;}
.btn .sub{display:block; font-size:13px; color:var(--muted); margin-top:5px; font-style:italic;}
.next-btn{
  margin-top:32px; background:linear-gradient(90deg,#3a2e1a,#2a2415); color:var(--gold);
  border:1px solid var(--gold-dim); padding:14px 22px; border-radius:30px; font-size:15px;
  cursor:pointer; align-self:flex-start; letter-spacing:1px;
}
.next-btn.secondary{background:none; color:var(--muted); border:1px solid var(--line); font-size:13px;}
.chart{display:flex; align-items:flex-end; gap:14px; height:120px; margin:20px 0;}
.bar{width:44px; background:linear-gradient(180deg,var(--gold),var(--gold-dim)); border-radius:4px 4px 0 0; position:relative; opacity:0; animation:rise 1s ease forwards;}
.bar span{position:absolute; top:-22px; left:0; right:0; text-align:center; font-size:12px; color:var(--muted);}
.bar b{position:absolute; bottom:-24px; left:0; right:0; text-align:center; font-size:12px; color:var(--muted); font-weight:normal;}
@keyframes rise{from{opacity:0;} to{opacity:1;}}
.deck{display:flex; gap:12px; overflow-x:auto; padding-bottom:10px; margin:18px 0;}
.deckcard{min-width:230px; background:#141c2c; border:1px solid var(--line); border-radius:12px; padding:16px;}
.deckcard h3{font-size:15px; color:var(--gold); margin-bottom:6px;}
.deckcard p{font-size:13px; line-height:1.7;}
.stage{position:relative; height:150px; margin:20px 0; border-bottom:1px solid var(--line);}
.stage .spot{position:absolute; bottom:0; left:50%; transform:translateX(-50%); font-size:40px; animation:glow 1.6s ease infinite alternate;}
@keyframes glow{from{filter:drop-shadow(0 0 4px var(--gold));} to{filter:drop-shadow(0 0 16px var(--gold));}}
.postcard{border:2px dashed var(--gold-dim); border-radius:8px; padding:20px; margin:20px 0; text-align:center;}
.postcard .stamp{font-size:34px; margin-top:10px;}
.footer-note{margin-top:auto; padding-top:30px; font-size:11px; color:#4a5470; text-align:center;}
.charcard{background:#141c2c; border:1px solid var(--gold-dim); border-radius:14px; padding:24px; text-align:center; margin:20px 0;}
.charcard .emoji{font-size:52px; margin-bottom:10px;}
.charcard h2{color:var(--gold); font-size:22px; margin-bottom:12px;}
</style>
</head>
<body>
<div id="app"></div>

let li = -1; // level index, -1 = intro
let phase = 0; // 0 exhibit/transition, 1 question, 2 feedback

function render(){
  app.innerHTML = "";
  if(li === -1) return renderIntro();
  if(li === levels.length) return renderFinale();
  if(li === levels.length+1) return renderReveal();
  const lv = levels[li];
  const wrap = document.createElement('div'); wrap.className='card';
  const prog = document.createElement('div'); prog.className='progress';
  prog.textContent = `0${lv.num} / 06　${lv.title}`;
  app.appendChild(prog);
  app.appendChild(wrap);

  if(phase===0){
    let html = `<div class="kicker">展場</div>`;
    if(lv.artist) html += `<div class="artist">${lv.artist}</div>`;
    html += `<p>${lv.exhibit}</p>`;
    wrap.innerHTML = html;
    if(lv.nodes){
      const nd = document.createElement('div'); nd.className='nodes';
      lv.nodes.forEach((n,i)=>{ const s=document.createElement('div'); s.className='node'; s.textContent=n; s.style.animationDelay=(i*0.12)+'s'; nd.appendChild(s); });
      wrap.appendChild(nd);
    }
    if(lv.chart){
      const c = document.createElement('div'); c.className='chart';
      const max = lv.chart[0][1];
      lv.chart.forEach((d,i)=>{ const b=document.createElement('div'); b.className='bar'; b.style.height=(d[1]/max*90)+'px'; b.style.animationDelay=(i*0.15)+'s'; b.innerHTML=`<span>${d[1]}</span><b>${d[0]}</b>`; c.appendChild(b); });
      wrap.appendChild(c);
    }
    if(lv.stage){
      const st = document.createElement('div'); st.className='stage';
      st.innerHTML = `<div class="spot">${lv.stage[0]}</div>`;
      wrap.appendChild(st);
    }
    if(lv.deck){
      const d = document.createElement('div'); d.className='deck';
      lv.deck.forEach(c=>{ const dc=document.createElement('div'); dc.className='deckcard'; dc.innerHTML=`<h3>${c.n}｜${c.t}</h3><p>${c.d}</p>`; d.appendChild(dc); });
      wrap.appendChild(d);
    }
    const b = document.createElement('button'); b.className='next-btn'; b.textContent='走進農場 →';
    b.onclick=()=>{ phase=0.5; renderTransition(lv); };
    wrap.appendChild(b);
  }
}

function renderTransition(lv){
  app.innerHTML=""; const prog=document.createElement('div'); prog.className='progress'; prog.textContent=`0${lv.num} / 06　${lv.title}`; app.appendChild(prog);
  const wrap=document.createElement('div'); wrap.className='card';
  wrap.innerHTML = `<div class="kicker">從作品走進農場</div><p>${lv.transition}</p><div class="big" style="font-size:19px;margin-top:24px;">${lv.question}</div>`;
  const opts = document.createElement('div');
  lv.options.forEach(o=>{
    const btn=document.createElement('button'); btn.className='btn';
    btn.innerHTML = `${o.e} <b>${o.l}. ${o.t}</b>` + (o.s?`<span class="sub">${o.s}</span>`:'');
    btn.onclick=()=>choose(lv,o);
    opts.appendChild(btn);
  });
  wrap.appendChild(opts);
  app.appendChild(wrap);
}

function choose(lv,o){
  addPts(o.p); picks['L'+lv.num]=o.l;
  app.innerHTML=""; const prog=document.createElement('div'); prog.className='progress'; prog.textContent=`0${lv.num} / 06　${lv.title}`; app.appendChild(prog);
  const wrap=document.createElement('div'); wrap.className='card';
  wrap.innerHTML = `<div class="kicker">你選擇了：${o.e} ${o.t}</div><p>${lv.feedback}</p><div class="big">${lv.big}</div>`;
  const b=document.createElement('button'); b.className='next-btn'; b.textContent = lv.num===6 ? '前往終章 →' : '前往下一個展場 →';
  b.onclick=()=>{ li++; render(); };
  wrap.appendChild(b);
  app.appendChild(wrap);
}

function renderIntro(){
  const wrap=document.createElement('div'); wrap.className='card';
  wrap.innerHTML = `
    <div class="kicker">六關線上互動思辨遊戲</div>
    <h1>微光思辨</h1>
    <p>每一次「留下」，都可能伴隨另一種改變。<br>走過六個展場，做出六次選擇——<br>看看今晚，農場會讓你代表誰。</p>`;
  const b=document.createElement('button'); b.className='next-btn'; b.textContent='開始 →';
  b.onclick=()=>{ li=0; render(); };
  wrap.appendChild(b);
  app.appendChild(wrap);
}

function renderFinale(){
  const wrap=document.createElement('div'); wrap.className='card';
  wrap.innerHTML = `
    <div class="kicker">六關完成</div>
    <p>我們一路上，移除了一些東西。保護了一些生命。決定了什麼時候介入。辨認曾經存在的痕跡。決定誰可以站在舞台中央。也選擇了想留給未來的事物。</p>
    <p style="margin-top:16px;">但是城市的空間有限。每一次「留下」，都可能伴隨另一種改變。</p>
    <div class="big">如果另一種生命\n也想繼續住在這裡——\n\n我們願意為牠的存在，\n改變多少自己的生活？</div>
    <div class="postcard"><div class="kicker">✉ 時光郵局</div><p style="font-size:14px;">你可以真的寫一封信，寄給一百年後可能站在同一片土地上的人。</p><div class="stamp">🕰️✉️🕰️</div></div>`;
  const b=document.createElement('button'); b.className='next-btn'; b.textContent='看看今晚農場讓我代表誰 →';
  b.onclick=()=>{ li++; render(); };
  const b2=document.createElement('button'); b2.className='next-btn secondary'; b2.textContent='稍後再寫信，先看代表角色';
  b2.onclick=b.onclick;
  wrap.appendChild(b); wrap.appendChild(b2);
  app.appendChild(wrap);
}

function renderReveal(){
  let top=chars[0]; for(const c of chars) if(scores[c]>scores[top]) top=c;
  const info = charInfo[top];
  const wrap=document.createElement('div'); wrap.className='card';
  wrap.innerHTML = `
    <div class="kicker">你沒有得到唯一答案——生物多樣性本來就不是只有標準答案的題目</div>
    <div class="charcard">
      <div class="emoji">${info.e}</div>
      <h2>${top}</h2>
      <p style="text-align:center;">今晚，你的選擇與「${top}」特別靠近。</p>
      <p style="text-align:center;font-size:14px;color:#9aa4b8;">${info.d}</p>
    </div>
    <div class="big" style="text-align:center;">你是十五分之一的農場。</div>
    <p style="margin-top:10px;">還有另外十四個角色，看見了你可能沒有先注意到的東西。</p>`;
  const b=document.createElement('button'); b.className='next-btn'; b.textContent='去尋找另外十四分之十四 →';
  b.onclick=()=>{ b.disabled=true; b.textContent='（實體活動說明，敬請期待）'; };
  wrap.appendChild(b);
  app.appendChild(wrap);
}

render();
</script>
</body>
</html>
