<title>微光思辨｜十五分之一的農場</title>
<style>
:root{--bg:#06100d;--bg2:#0b1b15;--panel:#10251d;--panel2:#173229;--text:#f5f5ec;--muted:#a9bbb1;--line:#2d4a40;--glow:#eef7a9;--glow2:#c9df73;--warm:#f1e6a7;--orange:#e6a36e;--shadow:rgba(0,0,0,.38)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#050d0a;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{display:flex;justify-content:center;background:radial-gradient(circle at 50% 0,rgba(71,110,83,.2),transparent 28%),#050d0a}
button{font:inherit}.app{width:min(100%,560px);min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#081610,#050d0a 70%);box-shadow:0 0 100px rgba(0,0,0,.32)}
.screen{min-height:100vh;padding:20px 18px 132px;animation:enter .38s ease}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:grid;grid-template-columns:72px 1fr 72px;gap:8px;align-items:center;position:sticky;top:0;z-index:20;padding:8px 0 10px;background:linear-gradient(180deg,rgba(6,16,13,.98),rgba(6,16,13,.78),transparent);font-size:12px;color:var(--muted)}
.top .mid{text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.back{border:0;background:none;color:var(--muted);text-align:left;cursor:pointer;padding:4px 0}.num{text-align:right}.bar{height:3px;background:#173027;border-radius:4px;margin:-4px 0 20px;overflow:hidden}.bar i{height:100%;display:block;background:var(--glow2);transition:.35s}
h1,h2,h3,p{margin-top:0}h1{font-size:40px;line-height:1.12;margin-bottom:12px}h2{font-size:28px;line-height:1.35;margin-bottom:14px}h3{font-size:18px;color:var(--warm);line-height:1.45;margin-bottom:9px}p{font-size:16px;line-height:1.82}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--glow2);text-transform:uppercase;margin-bottom:10px}
.hero{min-height:68vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.glow{width:18px;height:18px;border-radius:50%;background:var(--glow);box-shadow:0 0 17px 7px rgba(238,247,169,.42),0 0 65px 28px rgba(238,247,169,.08);animation:pulse 2.3s infinite;margin:24px}@keyframes pulse{0%,100%{transform:scale(.88);opacity:.78}50%{transform:scale(1.17);opacity:1}}
.card{background:linear-gradient(180deg,rgba(18,43,34,.97),rgba(10,26,20,.97));border:1px solid var(--line);border-radius:22px;padding:19px;margin:14px 0;box-shadow:0 16px 44px var(--shadow)}.quote{border-left:2px solid var(--glow2);padding:3px 0 3px 14px;color:var(--warm);font-size:18px;line-height:1.7;margin:20px 0}.bigq{font-size:27px;line-height:1.48;text-align:center;color:var(--warm);margin:29px 0}
.cta{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,560px);padding:16px 18px 22px;background:linear-gradient(180deg,transparent,rgba(6,16,13,.95) 26%,#06100d 60%)}.primary,.secondary{width:100%;padding:16px 18px;border-radius:16px;font-weight:800;cursor:pointer}.primary{border:0;background:var(--glow);color:#132015;box-shadow:0 0 22px rgba(238,247,169,.15)}.primary:disabled{opacity:.32;cursor:not-allowed}.secondary{margin-top:9px;background:#13291f;color:var(--text);border:1px solid var(--line)}
.visual{height:215px;border:1px solid var(--line);border-radius:23px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;position:relative;overflow:hidden;background:radial-gradient(circle at center,rgba(238,247,169,.06),transparent 58%),#091812}.visual.lines:before,.visual.lines:after{content:"";position:absolute;width:145%;height:2px;background:#7f9d8e;opacity:.45;transform:rotate(19deg)}.visual.lines:after{transform:rotate(-27deg);top:68%}.visual.spot{background:radial-gradient(circle at 50% 22%,rgba(238,247,169,.52) 0 8%,rgba(238,247,169,.13) 18%,transparent 42%),#050d0a}.visual.room{background:linear-gradient(180deg,#192720,#0a110e)}.visual.archive{background:linear-gradient(135deg,#20231d,#09110e)}.visual.stage{background:radial-gradient(circle at 50% 10%,rgba(238,247,169,.25),transparent 38%),#070e0c}.visual.future{background:linear-gradient(135deg,#17312e,#121825 45%,#271836)}.huge{font-size:54px}
.pills{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.pill{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#0d1f18;color:var(--muted);font-size:13px}.action{display:inline-block;padding:7px 11px;border-radius:999px;border:1px solid var(--line);color:var(--glow2);font-size:13px}
/* game hud */
.game-hud{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}.quest{font-size:13px;color:var(--muted)}.badge{font-size:12px;color:#182116;background:var(--glow2);border-radius:999px;padding:5px 9px;font-weight:800}.hint{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 15px}.gamebox{border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,#0c1e17,#07130f);min-height:370px;position:relative;overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,.16);margin:8px 0 18px}
/* q1 web */
.web{height:390px}.web svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.web line{stroke:#42685a;stroke-width:1.5;transition:.5s}.web line.cut{stroke:#815f54;opacity:.13}.webnode{position:absolute;width:76px;height:76px;border-radius:50%;border:1px solid #3b6254;background:#112a21;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;cursor:pointer;transition:.3s;box-shadow:0 6px 22px rgba(0,0,0,.25)}.webnode b{font-size:24px}.webnode:hover{transform:scale(1.04)}.webnode.cut{opacity:.22;filter:grayscale(1);transform:scale(.9)}.webnode.affected{border-color:#9b7e56;animation:shake .35s 2}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
/* q2 spotlight */
.spotgame{height:400px;background:#020806}.spotlight-orb{position:absolute;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(238,247,169,.48),rgba(238,247,169,.14) 38%,transparent 68%);transform:translate(-50%,-50%);transition:.38s;pointer-events:none;filter:blur(.2px)}.organism{position:absolute;width:84px;height:84px;border-radius:18px;border:1px solid #273b34;background:#07130f;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:.28s;padding:6px;font-size:11px}.organism b{font-size:27px}.organism.lit{color:var(--text);border-color:var(--glow2);background:#163127;transform:scale(1.07)}.coin{position:absolute;right:14px;top:14px;background:#f0d67d;color:#2d2511;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 0 20px rgba(240,214,125,.25);z-index:3}.coin.spent{animation:coinfly .6s both}@keyframes coinfly{to{transform:scale(.3);opacity:0}}
/* q3 timeline */
.chart{height:210px;position:relative;margin:16px}.chart svg{width:100%;height:100%}.chart polyline{fill:none;stroke:var(--glow2);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.chart circle{fill:var(--glow);stroke:#172218;stroke-width:3}.yearout{text-align:center;font-size:42px;color:var(--warm);font-weight:800}.popout{text-align:center;color:var(--muted)}.range{width:100%;accent-color:#c9df73}.pressure{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px 18px}.pressure div{border:1px solid var(--line);background:#10241c;border-radius:13px;padding:10px;font-size:13px}.strategy-grid{display:grid;gap:9px;margin-top:13px}.strategy{border:1px solid var(--line);background:#10241c;color:var(--text);border-radius:15px;padding:13px;text-align:left;cursor:pointer}.strategy.on{border-color:var(--glow2);background:#19352a}.strategy small{display:block;color:var(--muted);margin-top:4px}
/* q4 archaeology */
.digsite{height:410px;background:linear-gradient(#10211b 0 30%,#4a3c2b 30% 48%,#382d21 48% 68%,#2c231b 68%);position:relative}.layerlabel{position:absolute;right:10px;font-size:10px;color:rgba(255,255,255,.45)}.artifact{position:absolute;width:62px;height:62px;border-radius:50%;border:1px dashed rgba(255,255,255,.25);background:rgba(7,14,11,.38);display:flex;align-items:center;justify-content:center;font-size:27px;cursor:pointer;filter:brightness(.5);transition:.3s}.artifact.found{filter:none;border:1px solid var(--glow2);background:#163026;box-shadow:0 0 18px rgba(238,247,169,.16);transform:scale(1.08)}.foundbar{display:flex;gap:7px;justify-content:center;margin:10px}.founddot{width:10px;height:10px;border-radius:50%;background:#213b31}.founddot.on{background:var(--glow2);box-shadow:0 0 8px var(--glow2)}
/* q5 stage */
.stagebox{height:410px;background:linear-gradient(#07120e,#030806);position:relative}.stagefloor{position:absolute;left:8%;right:8%;bottom:40px;height:120px;background:linear-gradient(180deg,#19241f,#090e0c);clip-path:polygon(13% 0,87% 0,100% 100%,0 100%);border-top:1px solid #48574f}.stagebeam{position:absolute;left:50%;top:-15px;width:260px;height:365px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(238,247,169,.26),rgba(238,247,169,.03) 75%,transparent);clip-path:polygon(44% 0,56% 0,92% 100%,8% 100%);pointer-events:none}.director{position:absolute;left:50%;bottom:67px;transform:translateX(-50%);font-size:13px;color:var(--warm);text-align:center}.rolechips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:11px 0}.rolechip{border:1px solid var(--line);background:#10241c;color:var(--text);padding:10px 12px;border-radius:14px;cursor:pointer}.rolechip.on{border-color:var(--glow2);background:#19382c;box-shadow:0 0 14px rgba(238,247,169,.1)}.stageactors{position:absolute;inset:50px 30px 140px;display:flex;align-items:flex-end;justify-content:space-around;font-size:34px}.stageactors span{opacity:.36;transition:.35s}.stageactors span.on{opacity:1;transform:translateY(28px) scale(1.25);filter:drop-shadow(0 0 10px rgba(238,247,169,.25))}
/* q6 postcard */
.postcard{background:#e9e2cf;color:#263029;border-radius:21px;padding:20px;min-height:310px;transform:rotate(-1deg);box-shadow:0 18px 45px rgba(0,0,0,.3);margin:12px 0}.postcard h2,.postcard h3,.postcard p{color:#263029}.stampbox{float:right;width:82px;height:96px;border:2px dashed #8c725b;border-radius:7px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;padding:5px}.stampbox.filled{font-size:31px;border-style:solid;background:#f4edda;animation:stamp .35s}@keyframes stamp{50%{transform:scale(1.15) rotate(-4deg)}}.stampchoices{display:flex;gap:8px;overflow-x:auto;padding:7px 2px 12px}.stampchoice{min-width:100px;border:1px solid var(--line);background:#10241c;color:var(--text);border-radius:15px;padding:12px;text-align:center;cursor:pointer}.stampchoice.on{border-color:var(--glow2);background:#19352a}.stampchoice b{display:block;font-size:28px}.fly{animation:fly 1.2s forwards}@keyframes fly{to{transform:translate(140px,-240px) rotate(12deg) scale(.28);opacity:0}}
/* result */
.roleicon{text-align:center;font-size:68px;margin:15px 0 0}.rolename{text-align:center;font-size:33px;font-weight:900}.roletag{text-align:center;color:var(--glow2);font-weight:800;margin:5px 0 20px}.miniroles{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.minirole{font-size:12px;padding:7px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.firefly{position:fixed;width:4px;height:4px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px 3px rgba(238,247,169,.4);pointer-events:none;opacity:.55;animation:float 7s infinite ease-in-out;z-index:1}@keyframes float{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(18px,-42px);opacity:.8}}

"磯永吉小屋":{e:"🏠",tag:"你是記得的人",txt:"你容易注意時間留下的痕跡。對你來說，一棟老房子不只是建築，而是一段仍存在於現在的記憶。你提醒我們：新的事物很重要，但知道自己從哪裡來，也很重要。"},
"瑠公圳":{e:"💧",tag:"你是尋找隱藏連結的人",txt:"很多重要的事情不一定看得見。水可能藏到地下，歷史可能藏進城市。你會去尋找那些仍然默默連接一切的線。"},
"農田":{e:"🌾",tag:"你是共生的人",txt:"你不太想把人與自然分成兩邊。農場可以生產、研究、教育，也可以同時成為其他生命的家。你會問：我們怎麼一起生活？"},
"甜心房":{e:"☕",tag:"你是讓事物重新活一次的人",txt:"你接受改變，但改變不一定代表抹掉過去。舊建築可以得到新用途，一個空間也可以重新找到自己的位置。"},
"人工氣候室":{e:"🔬",tag:"你是願意動手改變的人",txt:"當環境出現問題，你傾向問：我們能做什麼？研究、科技、設計與管理，都可能成為回應環境問題的方法。"},
"考種館":{e:"🌱",tag:"你是替未來準備的人",txt:"一顆種子很小，但裡面可能藏著整片田地的未來。你做決定時，很容易想到：現在的選擇，會替下一個世代留下什麼？"},
"土壤館":{e:"🟫",tag:"你是看見基礎的人",txt:"你容易注意那些沒有人鼓掌，卻讓整個系統得以存在的東西。土壤、分解者、微生物通常不在聚光燈下，卻支撐許多生命。"},
"香水樹":{e:"🌼",tag:"你是用感官記住世界的人",txt:"你不只透過名字認識地方，也在意氣味、季節、光線、聲音，以及身體實際感受到的環境。"},
"螢火蟲":{e:"✨",tag:"你是替微光保留黑暗的人",txt:"你容易注意脆弱的環境。有時真正需要保護的不是增加什麼，而是少一點光、少一點干擾，多留一點黑暗。"},
"白鼻心":{e:"🐾",tag:"你是共享城市的人",txt:"你知道城市不是只有白天，也不是只屬於人。當我們睡著以後，另一群生命才剛開始牠們的一天。"},
"柴棺龜":{e:"🐢",tag:"你是替脆弱生命保留位置的人",txt:"你對棲地、界線與消失特別敏感。你會問：在改變發生以前，我們能不能先替牠留下一個位置？"},
"黑冠麻鷺":{e:"🐦",tag:"你是重新看見日常的人",txt:"你知道稀有不是值得珍惜的唯一理由。每天看到的鳥、每天經過的樹，也可能因為太普通而被忽略。"},
"黑眉錦蛇":{e:"🐍",tag:"你是替不受歡迎者說話的人",txt:"不是所有生命都可愛。有些甚至讓人害怕。但你不會立刻把『喜歡』與『值得存在』畫上等號。"},
"人面蜘蛛":{e:"🕸",tag:"你是看見整張網的人",txt:"你不太容易只看一個節點。當一種生命改變，你會自然想到其他生命會怎麼樣。你看見的農場，是一張彼此牽動的網。"},
"斑腿樹蛙":{e:"🐸",tag:"你是先辨認，再決定的人",txt:"有時最容易犯錯的時刻，就是太快覺得自己已經知道答案。你提醒我們：採取行動以前，先確認自己看見的是什麼。"}
};

q1:{A:["你剪掉了人工照明。","夜色變深，夜行生命得到更多黑暗；人的使用方式也必須重新調整。"],B:["你剪掉了昆蟲。","蜘蛛、蛙與鳥的連線跟著變弱。一個很小的節點，也可能連著很多生命。"],C:["你剪掉了植物。","遮蔭、土壤濕度與昆蟲一起改變，連鎖反應開始擴散。"],D:["你剪掉了水。","水域縮小，依賴水域的生命被擠進更小的棲地。"],E:["你剪掉了人。","自然空間增加，但農作、研究、維護與文化活動也一起變少。"]},
q2:{A:["你把唯一的保護幣投給螢火蟲。","明星物種能吸引人關心環境，但牠也依賴整個棲地。"],B:["你把保護幣投給檯面下的生命。","牠們不顯眼，卻參與分解、土壤形成與養分循環。"],C:["你優先保護原生水域生物。","保護的不只是個體，也包含牠需要的水域與岸邊環境。"],D:["你替不討喜的生命留了位置。","喜不喜歡一種生命，和牠是否值得存在，是兩個不同的問題。"],E:["你沒有把幣投給單一明星。","你先改善棲地，試著讓更多生命一起受益。"]},

q4:{A:["你封存了老建築與農業研究。","一棟建築，也可能留下某個時代如何理解土地與農業的痕跡。"],B:["你封存了水的記憶。","水路即使從地表消失，也可能留在地名、地形與地方故事裡。"],C:["你封存了農田的日常。","耕作、土壤與食物來源看似普通，也構成城市歷史。"],D:["你封存了夜晚的感官。","氣味、蛙鳴、黑暗與夜行生命，也能成為地方被記住的方法。"],E:["你封存了最普通的日常。","真正陪伴我們最久的，常常不是大事件，而是每天重複的小事。"],F:["你封存了被埋藏的痕跡。","被埋藏不代表不存在。考古也是替失去聲音的事物留下記憶。"]},
q5:{A:["你把舞台中央留給人。","校園承載人的學習與生活；問題是，其他生命需要的空間放在哪裡？"],B:["你把舞台讓給其他生命。","牠們沒有參與規劃，卻一直承受人類做出的空間決定。"],C:["你取消了唯一主角。","沒有固定中心後，空間必須持續協商不同生命的需求。"],D:["你讓舞台隨時間輪替。","同一個地方，白天與夜晚可能屬於完全不同的使用者。"],E:["你把聚光燈移向日常。","平凡並不代表不重要，有些生命只是因為太常見而被忽略。"],F:["你讓舞台保持流動。","中心被拿掉，空間可以依時間、需求與環境重新安排。"]},
q6:{A:["你在明信片貼上『黑暗』郵票。","未來的進步，也許不只是增加更多光，而是知道什麼時候可以不照亮。"],B:["你貼上『水』郵票。","一條水路同時是景觀、歷史，也可能是許多生命的棲地。"],C:["你貼上『農田』郵票。","即使城市高度發展，土地仍能提醒人們食物從哪裡來。"],D:["你貼上『老建築』郵票。","保存不一定意味維持原樣，也可能是讓舊空間得到新的生命。"],E:["你貼上『科學』郵票。","理解環境、辨認問題與檢驗介入效果，仍是照顧環境的一部分。"],F:["你貼上『共存』郵票。","真正多樣的城市，也必須容納讓人不舒服、害怕或容易忽略的生命。"],G:["你貼上『感官自然』郵票。","一座校園不只有建築，也有季節、氣味、聲音與身體感受到的自然。"]}

let s={page:"home",answers:{},history:[],q4found:[],q4mem:0,q3year:0};

function pageTop(title,n){return `<div class="top"><button class="back" onclick="back()">← 上一步</button><div class="mid">${title}</div><div class="num">${n?String(n).padStart(2,"0")+" / 06":""}</div></div>${n?`<div class="bar"><i style="width:${n/6*100}%"></i></div>`:""}`}
function cta(label,next,disabled=false){return `<div class="cta"><button class="primary" ${disabled?"disabled":""} onclick="${disabled?"":`nav('${next}')`}">${label}</button></div>`}
function exhibit(n,title,artist,work,body,q,next,cls){return `<section class="screen">${pageTop(title,n)}<div class="visual ${cls}"><div><div class="eyebrow">展場介紹</div><strong>${artist}</strong><br>${work}</div></div><h2>${artist}</h2><h3>${work}</h3><p>${body}</p><div class="quote">${q}</div>${cta("把這個問題帶進農場 →",next)}</section>`}
function feedback(q,title,n,question,action,next,extra=""){const a=s.answers[q],f=fb[q][a];return `<section class="screen">${pageTop(title,n)}<div class="feedback"><h3>${f[0]}</h3><p>${f[1]}</p></div>${extra?`<p class="muted">${extra}</p>`:""}<div class="bigq">${question}</div><span class="action">${action}</span>${cta(n===6?"完成六關 →":"下一關 →",next)}</section>`}
function scoreResult(){const score={};Object.keys(roles).forEach(k=>score[k]=0);["q1","q2","q3","q4","q5","q6"].forEach(q=>{const a=s.answers[q];if(!a)return;Object.entries(scoring[q][a]).forEach(([k,v])=>score[k]+=v)});let mx=Math.max(...Object.values(score)),t=Object.keys(score).filter(k=>score[k]===mx);if(t.length>1){for(const q of ["q6","q5","q4","q3"]){const a=s.answers[q];if(!a)continue;const m=scoring[q][a]||{};const lm=Math.max(...t.map(k=>m[k]||0));const nt=t.filter(k=>(m[k]||0)===lm);if(nt.length<t.length)t=nt;if(t.length===1)break}}return t[0]}

function cutNode(a,el){document.querySelectorAll('.webnode').forEach(x=>x.classList.remove('cut','affected'));document.querySelectorAll('.web line').forEach(x=>x.classList.remove('cut'));el.classList.add('cut');const affects={A:[1,6],B:[2,6,7],C:[1,5],D:[5,6],E:[2]}[a];affects.forEach(i=>document.querySelectorAll('.webnode')[i].classList.add('affected'));document.querySelectorAll('.web line').forEach((l,i)=>{if(i%3===0||a==='B'&&i<7)l.classList.add('cut')});s.answers.q1=a;save();buzz();document.getElementById('q1note').textContent=fb.q1[a][1];const b=document.getElementById('q1next');b.disabled=false;b.onclick=()=>nav('q1fb')}
function q2Game(){const org=[['A','✨','螢火蟲',41,12],['B','🪱','分解者',10,58],['C','🐢','原生水域',68,53],['D','🐍','蜘蛛與蛇',8,20],['E','🌿','整體棲地',66,17]];return `<section class="screen">${pageTop("第二關｜檯面之下",2)}<div class="game-hud"><span class="quest">任務：移動聚光燈，投出唯一保護幣</span><span class="badge">保護</span></div><h2>誰值得被照亮？</h2><p class="hint">先點不同角色看看，再把唯一一枚保護幣交出去。</p><div class="gamebox spotgame" id="spotgame"><div class="spotlight-orb" id="orb" style="left:50%;top:28%"></div><div class="coin" id="coin">1 枚</div>${org.map(o=>`<button class="organism" data-a="${o[0]}" style="left:${o[3]}%;top:${o[4]}%" onclick="spot('${o[0]}',this)"><b>${o[1]}</b>${o[2]}</button>`).join('')}</div><div id="spotnote" class="hint">聚光燈只能照亮一處，但生態不只一個角色。</div><div class="cta"><button id="protect" class="primary" disabled>把保護幣投給這裡</button></div></section>`}
function spot(a,el){document.querySelectorAll('.organism').forEach(x=>x.classList.remove('lit'));el.classList.add('lit');const box=document.getElementById('spotgame').getBoundingClientRect(),r=el.getBoundingClientRect();document.getElementById('orb').style.left=((r.left+r.width/2-box.left)/box.width*100)+'%';document.getElementById('orb').style.top=((r.top+r.height/2-box.top)/box.height*100)+'%';s.answers.q2=a;save();buzz();const b=document.getElementById('protect');b.disabled=false;b.onclick=()=>{document.getElementById('coin').classList.add('spent');setTimeout(()=>nav('q2fb'),450)}}
function q3Game(){const years=[2026,2030,2035,2040],pop=[87,72,55,31];return `<section class="screen">${pageTop("第三關｜Agony",3)}<div class="game-hud"><span class="quest">任務：拖動時間，決定何時／如何介入</span><span class="badge">介入</span></div><div class="yearout" id="year">${years[s.q3year||0]}</div><div class="popout">族群紀錄：<b id="pop">${pop[s.q3year||0]}</b></div><div class="gamebox" style="min-height:320px"><div class="chart"><svg viewBox="0 0 320 180"><polyline points="25,25 115,55 205,92 295,145"></polyline><circle cx="25" cy="25" r="7"></circle><circle cx="115" cy="55" r="7"></circle><circle cx="205" cy="92" r="7"></circle><circle cx="295" cy="145" r="7"></circle></svg></div><div style="padding:0 18px"><input class="range" id="timeRange" type="range" min="0" max="3" step="1" value="${s.q3year||0}" oninput="scrubYear(this.value)"></div><div class="pressure"><div>💡 人工照明 ↑</div><div>🌡 夜溫 ↑</div><div>💧 水質改變</div><div>🏙 棲地破碎 ↑</div></div></div><p class="hint">滑到 2040 看完趨勢後，策略才會解鎖。</p><div id="strategies" class="strategy-grid" style="opacity:${(s.q3year||0)==3?1:.35};pointer-events:${(s.q3year||0)==3?'auto':'none'}"><button class="strategy" onclick="strategy('A',this)">⚡ 現在就介入<small>等到消失，也許太晚。</small></button><button class="strategy" onclick="strategy('B',this)">🌿 先改善棲地<small>先處理水、光、土地。</small></button><button class="strategy" onclick="strategy('C',this)">📊 先蒐集更多資料<small>避免錯誤介入。</small></button><button class="strategy" onclick="strategy('D',this)">🌙 減少人為干預<small>讓自然有更多調整空間。</small></button><button class="strategy" onclick="strategy('E',this)">🔄 改變人的使用方式<small>重新安排共享空間。</small></button></div><div class="cta"><button id="q3next" class="primary" ${s.answers.q3?'':'disabled'} onclick="${s.answers.q3?"nav('q3fb')":''}">確認介入策略</button></div></section>`}

function q4Memory(){const mem=[['劉錫霖','《漂流瓶考古》、《腐化》','人的肉身會腐化，照片會褪色，名字會被遺忘。一段地方歷史，也可能慢慢失去輪廓。','記憶｜腐化｜考古'],['莊智程','《博雅深夜食堂》','宿舍、學餐、選課、社團。不同年代的普通生活並不相同；共同生活，也是歷史。','跨世代記憶'],['江秋華','《夜間記憶－臺大夜特敏》','每一次夜間散步，都在校園裡留下自己的路線。今天的夜晚，也可能成為多年後的記憶。','夜間散步｜個人記憶'],['林姵均','《Cycle-Go-Round》','自行車原本只是趕路工具，但雨天、找車、與某個人一起騎過的路，也能成為青春的一部分。','記憶交換｜自行車 × 故事']];const m=mem[s.q4mem||0];return `<section class="screen">${pageTop("第四關｜誰替消失留下記憶？",4)}<div class="eyebrow">先翻閱四段記憶</div><div class="pills">${mem.map((x,i)=>`<button class="pill" style="${i===s.q4mem?'border-color:var(--glow2);color:var(--text)':''}" onclick="s.q4mem=${i};save();render()">${i+1} ${x[0]}</button>`).join('')}</div><div class="card" style="min-height:310px;margin-top:18px"><div class="visual archive" style="height:110px"><div class="huge">${['🫙','🍽','🌙','🚲'][s.q4mem||0]}</div></div><h3>${m[0]}</h3><h2>${m[1]}</h2><p>${m[2]}</p><p class="muted">${m[3]}</p></div>${cta("開始生態考古 →","q4game")}</section>`}
function q4Game(){const found=s.q4found||[];const arts=[['a','💧',18,32],['b','🌾',66,20],['c','🏠',39,58],['d','🌙',73,70],['e','🐛',9,72]];return `<section class="screen">${pageTop("第四關｜誰替消失留下記憶？",4)}<div class="game-hud"><span class="quest">任務：在地層中找到 3 個痕跡</span><span class="badge">辨認</span></div><h2>生態考古</h2><p class="hint">點擊你覺得藏有記憶的地方。</p><div class="gamebox digsite"><span class="layerlabel" style="top:34%">近代</span><span class="layerlabel" style="top:53%">較早</span><span class="layerlabel" style="top:74%">更早</span>${arts.map(x=>`<button class="artifact ${found.includes(x[0])?'found':''}" style="left:${x[2]}%;top:${x[3]}%" onclick="dig('${x[0]}',this)">${x[1]}</button>`).join('')}</div><div class="foundbar">${[0,1,2].map(i=>`<i class="founddot ${found.length>i?'on':''}"></i>`).join('')}</div><p id="dignote" class="hint">找到：${found.length} / 3</p>${found.length>=3?`<div class="card"><p>你已經挖到足夠的線索。現在只能替其中一類記憶「封存」。</p></div><div class="choices"><button class="choice" onclick="choose('q4','A','q4fb')"><strong>🏠 建築與農業研究</strong></button><button class="choice" onclick="choose('q4','B','q4fb')"><strong>💧 曾經流過的水</strong></button><button class="choice" onclick="choose('q4','C','q4fb')"><strong>🌾 農田與土地生活</strong></button><button class="choice" onclick="choose('q4','D','q4fb')"><strong>🌙 夜晚的氣味、聲音與生命</strong></button><button class="choice" onclick="choose('q4','E','q4fb')"><strong>🚲 最普通的日常</strong></button><button class="choice" onclick="choose('q4','F','q4fb')"><strong>🔍 被埋藏、很難看見的痕跡</strong></button></div>`:''}</section>`}

function direct(a,el){document.querySelectorAll('.rolechip').forEach(x=>x.classList.remove('on'));el.classList.add('on');s.answers.q5=a;save();buzz();document.querySelectorAll('.stageactors span').forEach(x=>x.classList.remove('on'));const map={A:[1],B:[2,3,4,5],C:[1,2,3,4,5],D:[1,5],E:[3,4],F:[1,2,3,4,5]}[a];map.forEach(i=>document.getElementById('a'+i).classList.add('on'));document.getElementById('director').textContent={A:'人站在中央',B:'其他生命站上中央',C:'沒有唯一中央',D:'白天與夜晚輪替',E:'讓不起眼者被看見',F:'舞台保持流動'}[a];const b=document.getElementById('q5next');b.disabled=false;b.onclick=()=>nav('q5fb')}
function q6Game(){const stamps=[['A','🌙','黑暗'],['B','💧','水'],['C','🌾','農田'],['D','🏠','老建築'],['E','🔬','科學'],['F','🐍','共存'],['G','🌿','感官自然']];const a=s.answers.q6;return `<section class="screen">${pageTop("第六關｜寫給未來",6)}<div class="game-hud"><span class="quest">任務：製作一張 2126 明信片</span><span class="badge">留下</span></div><div class="postcard" id="postcard"><div class="stampbox ${a?'filled':''}" id="stampbox">${a?stamps.find(x=>x[0]===a)[1]:'貼上郵票'}</div><h3>FROM：2026</h3><h2>TO：2126</h2><p>如果一百年後，有一位臺大學生站在你今天的位置——</p><p><strong>你最希望他還能看見什麼？</strong></p><br><p style="font-size:13px">選一枚郵票，代表你想交給未來的東西。</p></div><div class="stampchoices">${stamps.map(x=>`<button class="stampchoice ${a===x[0]?'on':''}" onclick="stampFuture('${x[0]}',this,'${x[1]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</div><div class="cta"><button id="q6next" class="primary" ${a?'':'disabled'} onclick="${a?"sendCard()":''}">蓋章，寄往 2126</button></div></section>`}
function stampFuture(a,el,emoji){document.querySelectorAll('.stampchoice').forEach(x=>x.classList.remove('on'));el.classList.add('on');s.answers.q6=a;save();buzz();const box=document.getElementById('stampbox');box.classList.add('filled');box.textContent=emoji;const b=document.getElementById('q6next');b.disabled=false;b.onclick=sendCard}
function sendCard(){document.getElementById('postcard').classList.add('fly');buzz();setTimeout(()=>nav('q6fb'),900)}
function openMail(){if(TIME_MAIL_URL)window.open(TIME_MAIL_URL,'_blank');else alert('目前尚未填入「時光郵局寄給未來的信」正式網址。')}
function render(){let h='';switch(s.page){
case'home':h=`<section class="screen">${fireflies()}<div class="hero"><div class="eyebrow">臺大百晝之夜 × 夜訪農場</div><div class="glow"></div><h1>微光思辨</h1><h3>十五分之一的農場</h3><p class="muted">六個展場，六次行動。<br>不是答題，而是做出你的選擇。</p><div class="pills"><span class="pill">剪</span><span class="pill">照</span><span class="pill">拖</span><span class="pill">挖</span><span class="pill">導演</span><span class="pill">寄出</span></div></div><div class="cta"><button class="primary" onclick="nav('intro')">開始夜訪 →</button>${Object.keys(s.answers).length?`<button class="secondary" onclick="reset()">重新開始</button>`:''}</div></section>`;break;
case'intro':h=`<section class="screen">${pageTop('遊戲說明',0)}<div class="hero"><h2>你會經過六個展場</h2><p>每一件作品先提出一個問題，接著把問題帶進臺大農場。</p><div class="card"><p>你會真的動手：剪掉一個節點、移動聚光燈、拖動時間、挖掘痕跡、安排舞台、寄一張明信片。</p></div><div class="quote">沒有正確答案。系統只記錄：今晚，你怎麼看這座農場。</div></div>${cta('進入第一個展場 →','q1ex')}</section>`;break;
case'q1ex':h=exhibit(1,'第一關｜共同編織','郭子萱','《當記憶織成一片樹蔭》','不同的線與繩結彼此編織，看似獨立，卻共同支撐完整形狀。如果其中一條被剪斷，改變的可能不只是一條線。','剪掉一條線，會怎樣？','q1game','lines');break;
case'q1game':h=q1Game();break;
case'q1fb':h=feedback('q1','第一關｜共同編織',1,'少掉一個物種，真的只是少掉一個物種嗎？','你完成了：移除','q2ex');break;
case'q2ex':h=exhibit(2,'第二關｜檯面之下','莊智程','《另類百大貢獻》','作品像「百大貢獻的影子」，讓那些看似微不足道、甚至令人訝異「這也能成為展覽？」的事情被重新看見。重要與不重要的界線，也可以隨觀看位置被翻轉。','誰有資格被定義成重要？','q2game','spot');break;
case'q2game':h=q2Game();break;
case'q2fb':h=feedback('q2','第二關｜檯面之下',2,'我們希望留下螢火蟲，是因為牠重要，還是因為牠容易被我們喜歡？','你完成了：保護','q3ex','如果一種生命永遠不會站上聚光燈，它還值得被保護嗎？');break;
case'q3ex':h=exhibit(3,'第三關｜Agony','鍾家萱','《Agony Room》','有些痛苦不會突然發生。壓力可能一點一點累積，外觀看起來仍然完整，內部卻已經開始改變。','還撐得住，就代表沒有問題嗎？','q3game','room');break;
case'q3game':h=q3Game();break;
case'q3fb':h=feedback('q3','第三關｜Agony',3,'活著，和活得很好，是同一件事嗎？','你完成了：介入','q4memory');break;
case'q4memory':h=q4Memory();break;
case'q4game':h=q4Game();break;
case'q4fb':h=feedback('q4','第四關｜誰替消失留下記憶？',4,'一條消失的水圳、一片消失的土地、一群消失的生命——誰替牠們留下記憶？','你完成了：辨認','q5ex','沒有被記錄的東西，也曾經存在。');break;
case'q5ex':h=exhibit(5,'第五關｜誰站在臺上？','校慶演唱會策展概念','何翊綺、陳君睿、沈士紘、麥家儀','臺大像一座演出了近百年的舞台。學生、教授、研究者與校友在不同時代出場又離場。但如果把舞台再放大，還有誰其實一直在上面？','除了人，還有誰能站在臺上？','q5game','stage');break;
case'q5game':h=q5Game();break;
case'q5fb':h=feedback('q5','第五關｜誰站在臺上？',5,'如果城市是一座舞台，誰決定誰可以站在臺上？','你完成了：決定','q6ex');break;
case'q6ex':h=exhibit(6,'第六關｜寫給未來','梁安哲','《Everything Everywhere in the Far Future》','如果不用考慮現實，你覺得臺大的未來會是什麼樣子？作品不急著預測正確的未來，而是邀請大家大膽想像。','這是我們對臺大未來的想像。那你的呢？','q6game','future');break;
case'q6game':h=q6Game();break;
case'q6fb':h=feedback('q6','第六關｜寫給未來',6,'我們今天認為理所當然存在的東西，一百年後，也會在嗎？','你完成了：留下','mail');break;
case'mail':h=`<section class="screen">${pageTop('時光郵局',6)}<div class="postcard"><div class="stampbox filled">✉</div><h2>時光郵局</h2><p>剛才，你替 2126 留下了一個選擇。</p><p>如果真的能寄一封信給一百年後的人——你想說什麼？</p></div><div class="card"><p>你可以寫：希望什麼還在、害怕什麼消失、希望未來的人如何記得現在，或只留下一句話。</p></div><div class="quote">有些記憶，是我們從過去挖掘出來的。<br>有些記憶，要由今天的我們開始留下。</div><div class="cta"><button class="primary" onclick="openMail()">✉ 前往「時光郵局寄給未來的信」</button><button class="secondary" onclick="nav('final1')">稍後再寫，先完成遊戲</button></div></section>`;break;
case'final1':h=`<section class="screen">${pageTop('終極關卡',0)}<div class="hero"><div class="pills"><span class="pill">移除</span><span class="pill">保護</span><span class="pill">介入</span><span class="pill">辨認</span><span class="pill">決定</span><span class="pill">留下</span></div><p>一路上，你做了六次行動。</p><div class="glow"></div><p class="muted">城市的空間有限。每一次「留下」，都可能伴隨另一種改變。</p></div>${cta('繼續 →','final2')}</section>`;break;
case'final2':h=`<section class="screen">${fireflies()}<div class="hero"><div class="glow"></div><div class="bigq">如果另一種生命<br>也想繼續住在這裡——</div><h2>我們願意為牠的存在，<br>改變多少自己的生活？</h2><p class="muted">這一題沒有選項，也沒有標準答案。</p></div>${cta('看看我的十五分之一 →','resultIntro')}</section>`;break;
case'resultIntro':h=`<section class="screen"><div class="hero"><p>你沒有得到唯一答案。</p><p class="muted">因為生物多樣性，本來就不是一道只有標準答案的題目。</p><div class="glow"></div><p>但在今晚的六次行動裡，</p><h2>有一種觀看農場的方法，<br>和你走得特別近。</h2></div>${cta('揭曉我的十五分之一 →','result')}</section>`;break;
case'result':{const w=scoreResult(),r=roles[w];h=`<section class="screen">${pageTop('十五分之一揭曉',0)}<div class="roleicon">${r.e}</div><div class="rolename">${w}</div><div class="roletag">${r.tag}</div><div class="card"><p>${r.txt}</p></div><p style="text-align:center"><strong>今晚，你的選擇與「${w}」特別靠近。</strong></p><h2 style="text-align:center">你是十五分之一的農場。</h2>${cta('去找另外十四分之十四 →','ending')}</section>`}break;
case'ending':h=`<section class="screen"><div class="hero"><h2>一座農場，不可能只有你所代表的這一部分。</h2><p>另外十四個角色，看見了你可能沒有先注意到的東西。</p><div class="miniroles">${Object.entries(roles).map(([k,r])=>`<span class="minirole">${r.e} ${k}</span>`).join('')}</div><div class="quote">農場從來不是十五個答案，而是十五個答案之間，仍然彼此連著的線。</div></div><div class="cta"><button class="primary" onclick="reset()">重新體驗一次</button></div></section>`;break;
default:s.page='home';save();return render()}
document.getElementById('app').innerHTML=h;window.scrollTo({top:0,behavior:'instant'})}
render();
</script>
</body>
</html>
