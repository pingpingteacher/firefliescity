<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>微光思辨｜十五分之一的農場</title>
<style>
  :root{
    --bg:#07110f;
    --panel:#0d1d19;
    --panel2:#112720;
    --text:#f2f5ee;
    --muted:#b7c6bd;
    --line:#2c463e;
    --glow:#e7f7a9;
    --glow2:#c6e37d;
    --accent:#f3efb1;
    --danger:#d5a49b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:radial-gradient(circle at 50% 20%,#112019 0%,var(--bg) 55%,#030706 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100%}
  body{display:flex;justify-content:center}
  #app{width:min(100%,520px);min-height:100vh;position:relative;overflow:hidden}
  .screen{display:none;min-height:100vh;padding:24px 20px 120px;animation:fade .45s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .topbar{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:26px}
  .back{background:none;border:none;color:var(--muted);font-size:14px;padding:4px 0;cursor:pointer}
  .progress{letter-spacing:.08em}
  h1,h2,h3,p{margin-top:0}
  h1{font-size:36px;line-height:1.18;margin-bottom:14px}
  h2{font-size:27px;line-height:1.25;margin-bottom:16px}
  h3{font-size:18px;margin-bottom:10px;color:var(--accent)}
  p{font-size:17px;line-height:1.8;color:var(--text)}
  .muted{color:var(--muted)}
  .eyebrow{font-size:13px;color:var(--glow2);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
  .card{background:linear-gradient(180deg,rgba(18,39,33,.96),rgba(10,24,20,.96));border:1px solid var(--line);border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 18px 50px rgba(0,0,0,.18)}
  .quote{border-left:2px solid var(--glow2);padding-left:14px;color:var(--accent);font-size:20px;line-height:1.6;margin:18px 0}
  .cta-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,520px);padding:16px 20px 22px;background:linear-gradient(180deg,rgba(7,17,15,0),rgba(7,17,15,.94) 24%,rgba(7,17,15,1) 60%)}
  button.primary, button.secondary{
    width:100%;border:none;border-radius:16px;padding:16px 18px;font-size:16px;font-weight:700;cursor:pointer
  }
  button.primary{background:var(--glow);color:#132014;box-shadow:0 0 24px rgba(231,247,169,.17)}
  button.secondary{background:#172a24;color:var(--text);border:1px solid var(--line);margin-top:10px}
  .choices{display:grid;gap:12px;margin:20px 0 30px}
  .choice{background:#10231d;border:1px solid #2a423a;border-radius:16px;padding:16px;color:var(--text);text-align:left;cursor:pointer;transition:.2s}
  .choice:hover,.choice.selected{border-color:var(--glow2);background:#173129;transform:translateY(-1px)}
  .choice strong{display:block;font-size:17px;margin-bottom:6px}
  .choice small{display:block;color:var(--muted);font-size:14px;line-height:1.5}
  .hero{min-height:58vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .glow-dot{width:18px;height:18px;border-radius:50%;background:var(--glow);box-shadow:0 0 18px 7px rgba(231,247,169,.45),0 0 60px 26px rgba(231,247,169,.09);animation:pulse 2.4s infinite ease-in-out;margin:26px auto}
  @keyframes pulse{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1.15);opacity:1}}
  .verbline{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0}
  .pill{border:1px solid var(--line);background:#102019;color:var(--muted);padding:8px 12px;border-radius:999px;font-size:14px}
  .network{position:relative;height:320px;margin:14px 0 24px;border-radius:22px;background:radial-gradient(circle at center,rgba(198,227,125,.08),transparent 58%);overflow:hidden}
  .node{position:absolute;width:82px;height:82px;border:1px solid #36554b;background:#10261f;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;padding:8px;box-shadow:0 0 18px rgba(0,0,0,.18)}
  .node.dim{opacity:.2;filter:grayscale(1)}
  .node.highlight{border-color:var(--glow2);box-shadow:0 0 20px rgba(198,227,125,.22)}
  .center-text{text-align:center;margin:28px 0}
  .big-question{font-size:29px;line-height:1.45;text-align:center;margin:28px 0;color:var(--accent)}
  .micro{font-size:14px;color:var(--muted);line-height:1.6}
  .art{height:210px;border-radius:22px;border:1px solid var(--line);background:
    linear-gradient(135deg,rgba(231,247,169,.05),rgba(255,255,255,0)),
    repeating-linear-gradient(90deg,transparent 0 28px,rgba(255,255,255,.02) 28px 29px);
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;padding:24px;margin-bottom:20px;position:relative;overflow:hidden
  }
  .line-art:before,.line-art:after{content:"";position:absolute;width:140%;height:2px;background:#6f8e81;transform:rotate(15deg);opacity:.45}
  .line-art:after{transform:rotate(-22deg);top:64%}
  .spotlight{background:radial-gradient(circle at 50% 28%,rgba(231,247,169,.48) 0 8%,rgba(231,247,169,.12) 18%,transparent 42%),#07110f}
  .room{background:linear-gradient(180deg,#17221e,#0f1714);box-shadow:inset 0 0 0 1px #38433f}
  .archive{background:linear-gradient(135deg,#191c18,#0b1110)}
  .stage{background:radial-gradient(circle at 50% 10%,rgba(231,247,169,.25),transparent 38%),linear-gradient(#111a17,#060a09)}
  .future{background:linear-gradient(135deg,#172a29,#10151c 40%,#1f1730)}
  .feedback{padding:22px;border-radius:20px;background:#0d1b17;border:1px solid #29453b;margin:22px 0}
  .feedback h3{color:var(--glow)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
  .stat{padding:14px;border-radius:14px;background:#10221d;border:1px solid var(--line);text-align:center}
  .stat b{display:block;font-size:22px;color:var(--accent)}
  .timeline{height:8px;background:#21342d;border-radius:999px;margin:26px 0;position:relative}
  .timeline:after{content:"";position:absolute;left:10%;right:10%;top:-5px;height:18px;border-left:1px solid #729183;border-right:1px solid #729183}
  .postcard{background:#e7e1cf;color:#263028;border-radius:20px;padding:22px;min-height:260px;box-shadow:0 18px 45px rgba(0,0,0,.25);transform:rotate(-1deg);margin:18px 0}
  .postcard h3,.postcard p{color:#263028}
  .stamp{float:right;border:2px solid #8c6f57;border-radius:10px;padding:12px;font-weight:700}
  .role{font-size:42px;text-align:center;margin:20px 0 8px}
  .role-name{text-align:center;font-size:30px;margin-bottom:6px}
  .role-tag{text-align:center;color:var(--glow2);font-weight:700;margin-bottom:20px}
  .tiny-note{text-align:center;color:var(--muted);font-size:13px}
  .fade-list span{display:block;animation:appear .7s both;margin:10px 0;font-size:22px}
  .fade-list span:nth-child(2){animation-delay:.25s}.fade-list span:nth-child(3){animation-delay:.5s}.fade-list span:nth-child(4){animation-delay:.75s}.fade-list span:nth-child(5){animation-delay:1s}.fade-list span:nth-child(6){animation-delay:1.25s}
  @keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (min-width:700px){#app{box-shadow:0 0 80px rgba(0,0,0,.35)}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const roles = {
  "磯永吉小屋": {emoji:"🏠", tag:"你是記得的人", text:"你容易注意時間留下的痕跡。對你來說，一棟老房子不只是建築，而是一段仍然存在於現在的記憶。新的事物很重要，但知道自己從哪裡來，也同樣重要。"},
  "瑠公圳": {emoji:"💧", tag:"你是尋找隱藏連結的人", text:"很多重要的事情不一定看得見。水可能藏到地下，歷史可能藏進城市。你會去尋找那些仍然默默連接一切的線。"},
  "農田": {emoji:"🌾", tag:"你是共生的人", text:"你不太想把人與自然分成兩邊。農場可以生產、研究、教育，也可以同時成為其他生命的家。你會問：我們怎麼一起生活？"},
  "甜心房": {emoji:"☕", tag:"你是讓事物重新活一次的人", text:"你接受改變，但改變不一定代表抹掉過去。舊建築可以得到新用途，一個空間也可以重新找到自己的位置。"},
  "人工氣候室": {emoji:"🔬", tag:"你是願意動手改變的人", text:"當環境出現問題，你傾向問：我們能做什麼？研究、科技、設計與管理，都可能成為回應環境問題的方法。"},
  "考種館": {emoji:"🌱", tag:"你是替未來準備的人", text:"一顆種子很小，但裡面可能藏著整片田地的未來。你做決定時，容易想到：現在的選擇，會替下一個世代留下什麼？"},
  "土壤館": {emoji:"🟫", tag:"你是看見基礎的人", text:"你容易注意那些沒有人鼓掌，卻讓整個系統得以存在的東西。土壤、分解者、微生物，往往不在聚光燈下，卻支撐很多生命。"},
  "香水樹": {emoji:"🌼", tag:"你是用感官記住世界的人", text:"你不只透過名字認識地方，也在意氣味、季節、光線、聲音，以及身體實際感受到的環境。"},
  "螢火蟲": {emoji:"✨", tag:"你是替微光保留黑暗的人", text:"你容易注意脆弱的環境。有時真正需要保護的不是增加什麼，而是願意少一點光、少一點干擾，多留一點黑暗。"},
  "白鼻心": {emoji:"🐾", tag:"你是共享城市的人", text:"你知道城市不是只有白天，也不是只屬於人。當我們睡著以後，另一群生命才剛開始牠們的一天。"},
  "柴棺龜": {emoji:"🐢", tag:"你是替脆弱生命保留位置的人", text:"你對棲地、界線與消失特別敏感。你會問：在改變發生以前，我們能不能先替牠留下一個位置？"},
  "黑冠麻鷺": {emoji:"🐦", tag:"你是重新看見日常的人", text:"你知道稀有不是值得珍惜的唯一理由。每天看到的鳥、每天經過的樹，也可能因為太普通而被忽略。"},
  "黑眉錦蛇": {emoji:"🐍", tag:"你是替不受歡迎者說話的人", text:"不是所有生命都可愛。有些甚至讓人害怕。但你不會立刻把『喜歡』和『值得存在』畫上等號。"},
  "人面蜘蛛": {emoji:"🕸", tag:"你是看見整張網的人", text:"你不太容易只看一個節點。當一種生命改變，你會自然想到其他生命會怎麼樣。你看到的農場，是一張彼此牽動的網。"},
  "斑腿樹蛙": {emoji:"🐸", tag:"你是先辨認，再決定的人", text:"有時最容易犯錯的時刻，就是太快覺得自己已經知道答案。你提醒我們：採取行動以前，先確認自己看見的是什麼。"}
};

const score = {};
Object.keys(roles).forEach(k=>score[k]=0);
const answers = {};
let historyStack = [];
let current = "home";

function addScore(map){
  Object.entries(map).forEach(([k,v]) => {score[k]=(score[k]||0)+v});
}

const screens = {
home: () => `
<section class="screen active">
  <div class="hero">
    <div class="eyebrow">NTU Night Ecology Experience</div>
    <div class="glow-dot"></div>
    <h1>微光思辨</h1>
    <h3>十五分之一的農場</h3>
    <p class="muted">六道選擇。沒有標準答案。<br>最後，你會成為農場裡的一個代表。</p>
  </div>
  ${cta("開始夜訪","intro")}
</section>`,

intro:()=>`
<section class="screen active">
  ${topBar("遊戲說明","00 / 06")}
  <div class="center-text">
    <h2>你會經過六個展場</h2>
    <p>每一件作品，都會帶你走進一個農場裡的問題。</p>
    <div class="verbline">
      ${["移除","保護","介入","辨認","決定","留下"].map(v=>`<span class="pill">${v}</span>`).join("")}
    </div>
    <p class="quote">你不需要找出正確答案。只需要做出：你自己的選擇。</p>
  </div>
  ${cta("進入第一個展場","q1a")}
</section>`,

q1a:()=>artScreen("01 / 06","第一關｜共同編織","郭子萱","《當記憶織成一片樹蔭》",
"一條線，看起來只是一條線。<br><br>但不同的線彼此交織以後，開始互相支撐。",
"如果其中一條線被剪掉，改變的真的只有那一條線嗎？","把這個問題帶進農場 →","q1b","line-art"),

q1b:()=>`
<section class="screen active">${topBar("第一關｜共同編織","01 / 06")}
  <div class="network">
    ${node("💧 水",20,22)}${node("🟫 土壤",62,18)}${node("🌱 植物",38,44)}${node("🐛 昆蟲",8,60)}
    ${node("🐸 蛙類",70,56)}${node("🐦 鳥類",42,73)}${node("👤 人",4,30)}${node("💡 照明",72,30)}
  </div>
  <p>農場裡，也存在著一張看不見的網。</p>
  <p class="muted">每一個節點，都可能影響另一個節點。</p>
  ${cta("我準備好了","q1c")}
</section>`,

q1c:()=>choiceScreen("第一關｜共同編織","01 / 06","如果一定要拿掉一個節點，","你會先移除什麼？","q1",[
["A","💡 人工照明","夜晚不一定需要像白天一樣明亮。",{"螢火蟲":2,"白鼻心":1,"香水樹":1}],
["B","🐛 昆蟲","也許少一點小蟲，不會差太多？",{"人面蜘蛛":2,"黑冠麻鷺":1,"土壤館":1}],
["C","🌱 植物","只留一些主要植物，也許就夠了。",{"農田":2,"香水樹":1,"土壤館":1}],
["D","💧 水","如果必須騰出空間，也許水域可以縮小。",{"瑠公圳":2,"柴棺龜":1,"斑腿樹蛙":1}],
["E","👤 人","如果少一點人的活動，自然是不是會更好？",{"農田":2,"磯永吉小屋":1,"甜心房":1}]
],"q1f"),

q1f:()=>feedbackScreen("第一關｜共同編織","01 / 06","你拿掉了一個節點。","但開始改變的，好像不只一個。","少掉一個物種，真的只是少掉一個物種嗎？","你完成了：移除","q2a"),

q2a:()=>artScreen("02 / 06","第二關｜檯面之下","莊智程","《另類百大貢獻》",
"我們很容易記住重要人物、重大事件、偉大的研究。<br><br>但有些事情，第一眼甚至會讓人覺得：「原來這也能成為展覽？」",
"《另類百大貢獻》想看的，正是歷史的另一面。","看看暗面 →","q2b","spotlight"),

q2b:()=>`
<section class="screen active">${topBar("第二關｜檯面之下","02 / 06")}
  <div class="art spotlight"><div style="font-size:56px">✨</div></div>
  <h2>生態裡，也有明星。</h2>
  <p>談到農場生態復育，最容易站進聚光燈的，也許是：<strong>螢火蟲</strong>。</p>
  <p class="muted">但牠能出現在這裡，並不是只靠自己。</p>
  ${cta("做一次選擇 →","q2c")}
</section>`,

q2c:()=>choiceScreen("第二關｜檯面之下","02 / 06","農場今年只有一筆環境改善經費。","你只能先保護一群生命。","q2",[
["A","✨ 螢火蟲","牠能讓更多人開始關心這片環境。",{"螢火蟲":2,"香水樹":1}],
["B","🪱 蚯蚓、微生物與分解者","很少有人來看牠們，但很多生命依賴牠們。",{"土壤館":2,"人面蜘蛛":1}],
["C","🐢 原生水域生物","如果棲地消失，有些生命可能很難再回來。",{"柴棺龜":2,"瑠公圳":1}],
["D","🐍 蜘蛛、蛇等不討喜的生命","被喜歡，不應該是一種生命值得存在的條件。",{"黑眉錦蛇":2,"人面蜘蛛":1}],
["E","🌿 先改善整體棲地","如果環境變好，也許很多生命可以一起留下。",{"農田":2,"瑠公圳":1,"土壤館":1}]
],"q2f"),

q2f:()=>feedbackScreen("第二關｜檯面之下","02 / 06","聚光燈，讓我們看見一個明星。","但一個明星的背後，可能站著整個生態系。","我們希望留下螢火蟲，是因為牠重要，還是因為牠容易被我們喜歡？","你完成了：保護","q3a","如果一種生命永遠不會站上聚光燈，它還值得被保護嗎？"),

q3a:()=>artScreen("03 / 06","第三關｜Agony","鍾家萱","《Agony Room》",
"有些痛苦，不是突然發生。<br><br>壓力可能一點一點累積。外觀看起來仍然完整，裡面卻已經開始改變。",
"還撐得住，就代表沒有問題嗎？","把這個問題帶進農場 →","q3b","room"),

q3b:()=>`
<section class="screen active">${topBar("第三關｜Agony","03 / 06")}
  <h2>某個物種仍然存在</h2>
  <div class="stats">
    <div class="stat"><b>87</b><small>2026</small></div>
    <div class="stat"><b>72</b><small>2030</small></div>
    <div class="stat"><b>55</b><small>2035</small></div>
    <div class="stat"><b>31</b><small>2040</small></div>
  </div>
  <div class="card">
    <p>💡 人工照明 ↑</p><p>🌡 夜間溫度 ↑</p><p>💧 水質改變</p><p>🏙 棲地破碎 ↑</p>
  </div>
  <p class="quote">牠還在。沒有歸零。沒有消失。</p>
  ${cta("所以呢？ →","q3c")}
</section>`,

q3c:()=>choiceScreen("第三關｜Agony","03 / 06","牠還活著。","現在需要介入嗎？","q3",[
["A","現在就介入","等到完全消失，也許就太晚了。",{"人工氣候室":2,"螢火蟲":1}],
["B","先改善棲地","與其只救一種生命，我想先處理環境。",{"農田":2,"瑠公圳":1,"土壤館":1}],
["C","先蒐集更多資料","不知道原因以前，錯誤的介入也可能造成問題。",{"斑腿樹蛙":2,"柴棺龜":1}],
["D","盡量減少人為干預","自然的變化，不一定都需要由人控制。",{"白鼻心":2,"黑眉錦蛇":1}],
["E","改變人使用空間的方式","也許人不用離開，但我們可以換一種相處方法。",{"甜心房":2,"人工氣候室":1}]
],"q3f"),

q3f:()=>feedbackScreen("第三關｜Agony","03 / 06","每一種介入，都可能改變另一件事情。","沒有一條路徑能預先保證結果。","活著，和活得很好，是同一件事嗎？","你完成了：介入","q4a"),

q4a:()=>`
<section class="screen active">${topBar("第四關｜誰替消失留下記憶？","04 / 06")}

function topBar(title,progress){
  return `<div class="topbar"><button class="back" onclick="back()">← 上一步</button><span>${title}</span><span class="progress">${progress}</span></div>`;
}
function cta(label,next){
  return `<div class="cta-wrap"><button class="primary" onclick="go('${next}')">${label}</button></div>`;
}
function node(label,left,topv){
  return `<div class="node" style="left:${left}%;top:${topv}%">${label}</div>`;
}
function artScreen(progress,title,artist,work,body,quote,label,next,cls=""){
  return `<section class="screen active">${topBar(title,progress)}
    <div class="art ${cls}">${artist}<br>${work}</div>
    <div class="eyebrow">展場介紹</div>
    <h2>${artist}</h2>
    <h3>${work}</h3>
    <p>${body}</p>
    <div class="quote">${quote}</div>
    ${cta(label,next)}
  </section>`;
}
function memoryCard(artist,work,body,keywords,next){
  return `<section class="screen active">${topBar("第四關｜誰替消失留下記憶？","04 / 06")}
    <div class="art archive">${artist}<br>${work}</div>
    <div class="eyebrow">記憶片段</div>
    <h2>${artist}</h2><h3>${work}</h3>
    <p>${body}</p>
    ${keywords?`<p class="micro">${keywords}</p>`:""}
    ${cta("下一段記憶 →",next)}
  </section>`;
}
function choiceScreen(title,progress,kicker,question,key,options,next){
  return `<section class="screen active">${topBar(title,progress)}
    <p class="muted">${kicker}</p>
    <h2>${question}</h2>
    <div class="choices">
      ${options.map(([id,label,small,map])=>`
        <button class="choice" onclick='choose("${key}","${id}",${JSON.stringify(map)},"${next}")'>
          <strong>${id}｜${label}</strong>${small?`<small>${small}</small>`:""}
        </button>`).join("")}
    </div>
  </section>`;
}
function feedbackScreen(title,progress,a,b,q,done,next,extra=""){
  return `<section class="screen active">${topBar(title,progress)}
    <div class="feedback">
      <h3>${a}</h3>
      <p>${b}</p>
    </div>
    <div class="big-question">${q}</div>
    ${extra?`<p class="tiny-note">${extra}</p>`:""}
    <div class="pill" style="display:inline-block">${done}</div>
    ${cta("下一關 →",next)}
  </section>`;
}
function choose(key,id,map,next){
  if(answers[key]) return;
  answers[key]=id;
  addScore(map);
  go(next);
}
function resultScreen(){
  const sorted = Object.entries(score).sort((a,b)=>b[1]-a[1]);
  const max = sorted[0][1];
  let tied = sorted.filter(x=>x[1]===max).map(x=>x[0]);

  // 簡易平手機制：依 Q6 > Q5 > Q4 > Q3 已經在分數中反映主要角色；
  // 若仍完全平手，原型取角色字典中的第一個。
  const winner = tied[0];
  const r = roles[winner];
  return `<section class="screen active">${topBar("十五分之一揭曉","")}
    <div class="role">${r.emoji}</div>
    <div class="role-name">${winner}</div>
    <div class="role-tag">${r.tag}</div>
    <div class="card"><p>${r.text}</p></div>
    <p class="center-text"><strong>今晚，你的選擇與「${winner}」特別靠近。</strong></p>
    <h2 class="center-text">你是十五分之一的農場。</h2>
    ${cta("去看看另外十四分之十四 →","end")}
  </section>`;
}
function render(){
  document.getElementById("app").innerHTML = screens[current]();
  window.scrollTo({top:0,behavior:"instant"});
}
function go(next){
  historyStack.push(current);
  current=next;
  render();
}
function back(){
  if(!historyStack.length) return;
  current=historyStack.pop();
  render();
}
function resetGame(){
  Object.keys(score).forEach(k=>score[k]=0);
  Object.keys(answers).forEach(k=>delete answers[k]);
  historyStack=[];
  current="home";
  render();
}
render();
</script>
